<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walkthrough</title>
<!-- Creator Kit walkthrough template. Deterministic: everything is a pure function of the
     page clock t (window.__advance). No network, no CDN, system fonts only. -->
<style>
  :root { --accent:#ffb020; --accent2:#3ddc97; --ink:#0b0f17; }
  html,body { margin:0; background:#0b0f17; overflow:hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  #stage { position:relative; overflow:hidden; background:radial-gradient(circle at 50% 40%, #1b2333, #0b0f17); }
  .shot { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform,opacity;
          box-shadow:0 30px 80px rgba(0,0,0,.55); border-radius:6px; }
  svg#fx { position:absolute; inset:0; pointer-events:none; }
  #cursor { position:absolute; left:0; top:0; width:44px; height:54px; transform-origin:4px 4px;
            filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  .badge { position:absolute; width:62px; height:62px; margin:-31px 0 0 -31px; border-radius:50%;
           background:var(--accent); color:#111; font-weight:800; font-size:34px; line-height:62px; text-align:center;
           box-shadow:0 0 0 5px rgba(11,15,23,.85), 0 8px 18px rgba(0,0,0,.5); }
  .callout { position:absolute; max-width:460px; padding:16px 22px; border-radius:14px; background:#fff;
             color:#111; font-weight:700; font-size:30px; line-height:1.2; box-shadow:0 14px 34px rgba(0,0,0,.45);
             border:3px solid var(--accent); white-space:normal; }
  #cap { position:absolute; left:50%; width:1540px; margin-left:-770px; padding:22px 34px 24px;
         border-radius:20px; background:rgba(8,11,18,.88); border:2px solid rgba(255,255,255,.12);
         box-shadow:0 18px 50px rgba(0,0,0,.5); color:#fff; display:flex; gap:26px; align-items:center; }
  #cap .num { flex:none; width:64px; height:64px; border-radius:50%; background:var(--accent); color:#111;
              font-weight:800; font-size:34px; line-height:64px; text-align:center; }
  #cap .txt { font-size:42px; line-height:1.28; font-weight:650; letter-spacing:-.2px; }
  #cap .w { opacity:.62; transition:none; }
  #cap .w.on { opacity:1; }
  #cap .w.now { opacity:1; color:var(--accent); }
  #hdr { position:absolute; left:40px; top:30px; color:#fff; font-size:26px; font-weight:700;
         padding:10px 18px; border-radius:12px; background:rgba(8,11,18,.78); }
  #hdr span { color:var(--accent); margin-left:12px; }
  #bar { position:absolute; left:0; top:0; height:7px; background:var(--accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="shots"></div>
  <svg id="fx" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="hole"><rect id="mfull" x="0" y="0" fill="#fff"/><rect id="mhole" rx="14" fill="#000"/></mask>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect id="dim" x="0" y="0" fill="#05070c" mask="url(#hole)"/>
    <rect id="ring" rx="14" fill="none" stroke="var(--accent)" stroke-width="5" filter="url(#glow)"/>
    <g id="ripples"></g>
    <path id="arrowShadow" fill="none" stroke="rgba(0,0,0,.55)" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="arrow" fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="arrow2" fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    <path id="head" fill="none" stroke="var(--accent)" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div id="layer"></div>
  <svg id="cursor" viewBox="0 0 44 54"><path d="M4 4 L4 44 L14 34 L21 50 L28 47 L21 31 L36 31 Z"
       fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg>
  <div id="hdr"></div>
  <div id="bar"></div>
  <div id="cap"><div class="num"></div><div class="txt"></div></div>
</div>
<script>
const D = /*__WALKTHROUGH_DATA__*/null;
const W = D.W, H = D.H, S = D.steps;
const $ = id => document.getElementById(id);
const stage = $('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
for (const id of ['mfull','dim']) { $(id).setAttribute('width', W); $(id).setAttribute('height', H); }
$('fx').setAttribute('viewBox', `0 0 ${W} ${H}`);
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const has = (s, k) => s.annotations.includes(k);
const lerp = (a, b, k) => a + (b - a) * k;

// one <img> per step; crossfade between differing images
const imgs = S.map((s, i) => { const im = new Image(); im.src = s.src; im.className = 'shot';
  im.width = s.iw; im.height = s.ih; $('shots').appendChild(im); return im; });

function camera(s, k) {
  const fit = Math.min((W - 120) / s.iw, (H - 120) / s.ih);
  const t = s.target, tx = t.x + t.w/2, ty = t.y + t.h/2;
  let z = 1;
  if (has(s, 'zoom')) z = clamp(Math.min(0.5 * W / (t.w * fit), 0.5 * H / (t.h * fit)), 1, 2.4);
  const sc = fit * lerp(1, z, k);
  let cx = lerp(s.iw/2, tx, k), cy = lerp(s.ih/2, ty, k);
  const hw = W/2/sc, hh = H/2/sc;  // keep the screenshot covering the frame once zoomed past it
  cx = s.iw > 2*hw ? clamp(cx, hw, s.iw - hw) : s.iw/2;
  cy = s.ih > 2*hh ? clamp(cy, hh, s.ih - hh) : s.ih/2;
  return { sc, cx, cy, X: x => W/2 + (x - cx)*sc, Y: y => H/2 + (y - cy)*sc };
}
function zoomK(s, lt, dur) {
  if (!has(s, 'zoom')) return 0;
  const last = s.n === S.length;
  return ease((lt - 0.35) / 0.9) * (last ? 1 : 1 - ease((lt - (dur - 0.65)) / 0.6));
}
function screenRect(s, cam, pad=10) {
  const t = s.target;
  return { x: cam.X(t.x) - pad, y: cam.Y(t.y) - pad, w: t.w*cam.sc + 2*pad, h: t.h*cam.sc + 2*pad };
}
// where the caption sits for a step (bottom unless the fully zoomed target lands there)
const capTop = S.map(s => { const c = camera(s, 1), r = screenRect(s, c);
  return r.y + r.h > H - 260 && r.y > 330; });

// ray from tail to rect centre; return point on rect boundary
function hitRect(r, px, py) {
  const cx = r.x + r.w/2, cy = r.y + r.h/2, dx = px - cx, dy = py - cy;
  const s = Math.min(Math.abs((r.w/2) / (dx || 1e-6)), Math.abs((r.h/2) / (dy || 1e-6)));
  return [cx + dx*s, cy + dy*s];
}
function arrowGeom(s, r) {
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  let dx = W/2 - cx, dy = H*0.45 - cy, L = Math.hypot(dx, dy);
  if (L < 80) { dx = -1; dy = -0.6; L = Math.hypot(dx, dy); }
  dx /= L; dy /= L;
  const len = 230;
  let [ex, ey] = hitRect(r, cx + dx*1e4, cy + dy*1e4);
  let tx = clamp(ex + dx*len, 120, W - 120), ty = clamp(ey + dy*len, 120, H - 120);
  // re-aim the head at the target edge from the (clamped) tail, leave a 14px gap
  [ex, ey] = hitRect(r, tx, ty);
  const ux = tx - ex, uy = ty - ey, ul = Math.hypot(ux, uy) || 1;
  const hx = ex + ux/ul*14, hy = ey + uy/ul*14;
  const bend = s.arrow_style === 'hand' ? 0.22 : 0.12;
  const mx = (tx + hx)/2 - uy/ul*ul*bend, my = (ty + hy)/2 + ux/ul*ul*bend;
  return { tx, ty, hx, hy, mx, my };
}
function arrowHead(g, size) {
  const ax = g.hx - g.mx, ay = g.hy - g.my, al = Math.hypot(ax, ay) || 1, ux = ax/al, uy = ay/al;
  const a = 0.5, c = Math.cos(a), sn = Math.sin(a);
  const p1 = [g.hx - size*(ux*c - uy*sn), g.hy - size*(uy*c + ux*sn)];
  const p2 = [g.hx - size*(ux*c + uy*sn), g.hy - size*(uy*c - ux*sn)];
  return `M${p1[0]},${p1[1]} L${g.hx},${g.hy} L${p2[0]},${p2[1]}`;
}
function stepAt(t) { let i = 0; while (i + 1 < S.length && t >= S[i+1].start) i++; return i; }
// click point sits low-right inside the target so the cursor never hides the label it points at
function targetCenter(s, cam) { const t = s.target; return [cam.X(t.x + t.w*0.7), cam.Y(t.y + t.h*0.72)]; }

// caption chunks of <= 11 words, timed by character share of the spoken duration
const chunks = S.map(s => {
  const words = s.caption.split(/\s+/).filter(Boolean), out = [];
  for (let i = 0; i < words.length; i += 11) out.push(words.slice(i, i + 11));
  if (out.length > 1 && out[out.length-1].length < 4) { const tail = out.pop(); out[out.length-1].push(...tail); }
  const total = words.join(' ').length; let acc = 0;
  return out.map(ws => ws.map(w => { const a = acc / total; acc += w.length + 1; return { w, a, b: acc / total }; }));
});
let lastCap = '';
function drawCaption(i, lt) {
  const s = S[i], cs = chunks[i], frac = clamp(lt / Math.max(0.3, s.speech));
  let ci = cs.findIndex(c => frac < c[c.length-1].b); if (ci < 0) ci = cs.length - 1;
  const key = i + ':' + ci;
  const txt = $('cap').querySelector('.txt');
  if (key !== lastCap) {
    txt.innerHTML = ''; cs[ci].forEach(o => { const sp = document.createElement('span'); sp.className = 'w';
      sp.textContent = o.w + ' '; txt.appendChild(sp); });
    $('cap').querySelector('.num').textContent = s.n; lastCap = key;
  }
  [...txt.children].forEach((sp, j) => { const o = cs[ci][j];
    sp.className = 'w' + (frac >= o.b ? ' on' : frac >= o.a ? ' now' : ''); });
  const cap = $('cap'); const top = capTop[i];
  cap.style.top = top ? '96px' : ''; cap.style.bottom = top ? '' : '44px';
  cap.style.opacity = clamp(lt / 0.25);
}

function render(t) {
  t = clamp(t, 0, D.total);
  const i = stepAt(t), s = S[i], lt = t - s.start, dur = s.end - s.start;
  const k = zoomK(s, lt, dur), cam = camera(s, k);
  // screenshots
  const prevSame = i > 0 && S[i-1].src === s.src;
  imgs.forEach((im, j) => {
    let op = 0, c = cam;
    if (j === i) op = prevSame ? 1 : clamp(lt / 0.35);
    else if (j === i - 1 && !prevSame) { op = 1 - clamp(lt / 0.35); c = camera(S[j], 0); }
    im.style.opacity = op;
    im.style.transform = `translate(${c.X(0)}px,${c.Y(0)}px) scale(${c.sc})`;
  });
  const r = screenRect(s, cam);
  // spotlight
  const spot = has(s, 'spotlight') ? ease((lt - 0.45) / 0.5) * (1 - ease((lt - (dur - 0.35)) / 0.3)) : 0;
  for (const [a, v] of [['x', r.x], ['y', r.y], ['width', r.w], ['height', r.h]]) {
    $('mhole').setAttribute(a, v); $('ring').setAttribute(a, v); }
  $('dim').setAttribute('opacity', 0.64 * spot);
  $('ring').setAttribute('opacity', spot);
  // arrow
  const g = arrowGeom(s, r);
  const dpath = `M${g.tx},${g.ty} Q${g.mx},${g.my} ${g.hx},${g.hy}`;
  const p = has(s, 'arrow') ? ease((lt - 0.95) / 0.6) : 0, fade = 1 - ease((lt - (dur - 0.3)) / 0.25);
  const hand = s.arrow_style === 'hand', sw = hand ? 11 : 9;
  for (const id of ['arrow', 'arrowShadow', 'arrow2']) {
    const el = $(id); el.setAttribute('d', id === 'arrow2'
      ? `M${g.tx+3},${g.ty-2} Q${g.mx+6},${g.my-5} ${g.hx+2},${g.hy+1}` : dpath);
    const L = el.getTotalLength(); el.setAttribute('stroke-dasharray', L);
    el.setAttribute('stroke-dashoffset', L * (1 - p));
    el.setAttribute('stroke-width', id === 'arrowShadow' ? sw + 8 : id === 'arrow2' ? 4 : sw);
    el.setAttribute('opacity', (id === 'arrow2' ? (hand ? .55 : 0) : id === 'arrowShadow' ? .6 : 1) * fade * (p > 0 ? 1 : 0));
  }
  $('head').setAttribute('d', arrowHead(g, hand ? 40 : 34));
  $('head').setAttribute('stroke-width', sw);
  $('head').setAttribute('opacity', clamp((p - 0.85) / 0.15) * fade);
  // ripples (click)
  const [ccx, ccy] = targetCenter(s, cam), rp = $('ripples');
  let html = '';
  if (has(s, 'click')) for (let n = 0; n < 6; n++) {
    const t0 = 1.55 + n * 1.3, a = lt - t0;
    if (a >= 0 && a < 1.1 && lt < dur - 0.2) { const q = a / 1.1;
      html += `<circle cx="${ccx}" cy="${ccy}" r="${12 + 70*ease(q)}" fill="none" stroke="#fff" stroke-width="${6*(1-q)+1}" opacity="${1-q}"/>`;
      if (q < .35) html += `<circle cx="${ccx}" cy="${ccy}" r="16" fill="var(--accent)" opacity="${.8*(1-q/.35)}"/>`; }
  }
  rp.innerHTML = html;
  // overlay layer: badge + callout
  let lay = '';
  if (has(s, 'badge')) { const b = back((lt - 0.6) / 0.45);
    const bx = g.tx < r.x + r.w/2 ? r.x + r.w : r.x, by = g.ty < r.y + r.h/2 ? r.y + r.h : r.y;  // corner away from the arrow
    lay += `<div class="badge" style="left:${bx}px;top:${by}px;transform:scale(${b});opacity:${clamp(b)*fade}">${s.n}</div>`; }
  if ((has(s, 'callout') || s.callout) && s.callout) { const o = ease((lt - 1.45) / 0.4) * fade;
    const left = g.tx < W/2, up = g.ty < H/2;
    const st = `${left ? 'right:' + (W - g.tx + 18) : 'left:' + (g.tx + 18)}px;${up ? 'bottom:' + (H - g.ty + 10) : 'top:' + (g.ty - 10)}px`;
    lay += `<div class="callout" style="${st};opacity:${o};transform:translateY(${(1-o)*14}px)">${s.callout.replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')}</div>`; }
  $('layer').innerHTML = lay;
  // cursor: glides from the previous target to this one, presses on each click
  const cur = $('cursor');
  if (has(s, 'cursor')) {
    let sx = W * 0.62, sy = H * 0.7;
    if (i > 0) { const pc = camera(S[i-1], 0); [sx, sy] = targetCenter(S[i-1], pc);
      if (S[i-1].src !== s.src) { sx = W*0.62; sy = H*0.7; } }
    const m = ease((lt - 0.2) / 1.2);
    const x = lerp(sx, ccx, m) + Math.sin(m * Math.PI) * 60, y = lerp(sy, ccy, m) - Math.sin(m * Math.PI) * 40;
    let press = 1; for (let n = 0; n < 6; n++) { const a = lt - (1.55 + n*1.3); if (a >= -0.1 && a < 0.15 && has(s,'click')) press = 0.82; }
    cur.style.opacity = 1; cur.style.transform = `translate(${x - 4}px,${y - 4}px) scale(${press})`;
  } else cur.style.opacity = 0;
  // chrome
  $('hdr').innerHTML = (D.title ? D.title.replace(/[<&]/g, '') : 'Walkthrough') + `<span>Step ${s.n} / ${S.length}</span>`;
  const rr = screenRect(s, camera(s, 1), 40); $('hdr').style.opacity = (capTop[i] || (rr.y < 110 && rr.x < 560)) ? 0 : 1;
  $('bar').style.width = (W * t / D.total) + 'px';
  drawCaption(i, lt);
}

let T = 0;
window.__advance = ms => { T += ms / 1000; render(T); };
window.__done = () => T >= D.total;
window.__seek = s => { T = s; render(T); };  // for spot checks
Promise.all(imgs.map(im => im.decode().catch(() => null))).then(() => { render(0); window.__ready = true; });
</script>
</body>
</html>
