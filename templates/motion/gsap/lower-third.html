<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@ — lower third</title>
<script>document.documentElement.classList.toggle('render',new URLSearchParams(location.search).has('render'));</script>
<style>
:root{color-scheme:dark;--bg:#070b12;--card:rgba(13,20,33,.88);--ink:#f8fafc;--muted:#9fb2c8;--accent:#38bdf8;--accent2:#818cf8;--title-size:calc(@@TITLE_SIZE@@px * 0.62)}
*{box-sizing:border-box;margin:0}
html,body{height:100vh;background:#05080d;color:var(--ink);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body{display:grid;grid-template-rows:1fr auto}
.viewport{position:relative;min-height:0;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;overflow:hidden;
 background:radial-gradient(960px 540px at 14% 88%,rgba(56,189,248,.16),transparent 62%),radial-gradient(760px 480px at 86% 18%,rgba(129,140,248,.13),transparent 58%),linear-gradient(155deg,#090f19 0%,#060a10 100%)}
.dot-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse at 25% 75%,black 20%,transparent 75%)}
.safe-frame{position:absolute;inset:42px 54px;border:1px solid rgba(255,255,255,.045);border-radius:16px;pointer-events:none}
.corner{position:absolute;width:16px;height:16px;border-color:rgba(56,189,248,.35);border-style:solid}
.c-tl{top:42px;left:54px;border-width:2px 0 0 2px;border-radius:4px 0 0 0}
.c-tr{top:42px;right:54px;border-width:2px 2px 0 0;border-radius:0 4px 0 0}
.c-bl{bottom:42px;left:54px;border-width:0 0 2px 2px;border-radius:0 0 0 4px}
.c-br{bottom:42px;right:54px;border-width:0 2px 2px 0;border-radius:0 0 4px 0}
.hud-top{position:absolute;top:64px;left:80px;right:80px;display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.22em;color:rgba(159,178,200,.62);text-transform:uppercase;font-weight:600}
.live-pill{display:inline-flex;align-items:center;gap:9px;padding:6px 13px;border-radius:999px;background:rgba(15,23,42,.68);border:1px solid rgba(56,189,248,.24);color:#cbe7ff;font-size:11px;letter-spacing:.2em}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.lt-anchor{position:absolute;left:78px;bottom:84px;max-width:960px;min-width:520px}
.lt-card{position:relative;display:flex;align-items:stretch;border-radius:16px;background:var(--card);border:1px solid rgba(255,255,255,.13);box-shadow:0 24px 64px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(14px);overflow:hidden}
.accent-bar{width:7px;flex:0 0 7px;background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);box-shadow:0 0 22px rgba(56,189,248,.65);transform-origin:50% 100%}
.lt-body{position:relative;padding:24px 36px 26px 28px;flex:1;min-width:0}
.lt-kicker{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.lt-kicker-line{width:28px;height:2px;background:linear-gradient(90deg,var(--accent),transparent);transform-origin:left}
.mask{overflow:hidden}
.title{font-size:clamp(30px,var(--title-size),52px);font-weight:800;line-height:1.08;letter-spacing:-.025em;color:var(--ink);overflow-wrap:anywhere}
.rule{height:1px;width:100%;margin:14px 0 12px;background:linear-gradient(90deg,rgba(56,189,248,.55),rgba(129,140,248,.22) 60%,transparent);transform-origin:left}
.subtitle{font-size:21px;font-weight:500;line-height:1.36;color:var(--muted);letter-spacing:-.01em;overflow-wrap:anywhere}
.shimmer{position:absolute;top:-20%;bottom:-20%;width:180px;left:-240px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-22deg);pointer-events:none}
.progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left;transform:scaleX(0)}
.controls{display:flex;align-items:center;gap:12px;padding:12px 24px;border-top:1px solid #ffffff1a;background:#070b12}
.controls button{border:1px solid #ffffff2e;border-radius:7px;background:#131d2e;color:#f1f5f9;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.controls input{flex:1;min-width:44px;accent-color:var(--accent)}
.time{font:12px monospace;min-width:86px;color:#9fb2c8;white-space:nowrap}
.render .controls{display:none}
@media(max-width:550px){.controls{gap:6px;padding:8px}.controls button{padding:6px 8px;font-size:12px}.time{font-size:10px;min-width:68px}}
</style>
</head>
<body>
<div class="viewport">
<main class="stage" data-composition-id="gsap-lower-third" data-duration="8" aria-label="GSAP lower-third composition">
  <div class="dot-grid"></div>
  <div class="safe-frame"></div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div><div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="hud-top">
    <span class="live-pill"><span class="live-dot"></span>LOWER THIRD · 16:9 SAFE</span>
    <span>CREATOR KIT // BROADCAST</span>
  </div>
  <section class="lt-anchor" aria-label="Lower third card">
    <div class="lt-card">
      <div class="accent-bar"></div>
      <div class="lt-body">
        <div class="lt-kicker"><span class="lt-kicker-line"></span><span>FEATURED</span></div>
        <div class="mask"><h1 class="title">@@TITLE@@</h1></div>
        <div class="rule"></div>
        <div class="mask"><p class="subtitle">@@SUBTITLE@@</p></div>
        <div class="shimmer"></div>
      </div>
    </div>
  </section>
  <div class="progress"><div class="progress-fill"></div></div>
</main>
</div>
<nav class="controls" aria-label="Motion preview controls"><button id="play" type="button">Play</button><button id="reset" type="button">Reset</button><button id="speed" type="button" aria-label="Playback speed">1×</button><input id="seek" aria-label="Seek animation" type="range" min="0" max="8" step="0.01" value="0"><output class="time" id="time">0.00 / 8.00s</output></nav>
<!-- GSAP's original proprietary notice is retained in the runtime below. Standard License: https://gsap.com/standard-license/ -->
<script>@@RUNTIME@@</script>
<script>
(()=>{'use strict';
const DURATION=8,stage=document.querySelector('.stage'),viewport=document.querySelector('.viewport');
const fit=()=>stage.style.setProperty('--fit',Math.min(viewport.clientWidth/1280,viewport.clientHeight/720));
fit();addEventListener('resize',fit);
// Fit authored copy inside safe-area card before timeline construction.
const card=document.querySelector('.lt-card'),titleEl=document.querySelector('.title'),subEl=document.querySelector('.subtitle');
let tSize=parseFloat(getComputedStyle(titleEl).fontSize),sSize=21;
for(let i=0;card.scrollHeight>250&&i<35;i++){
  tSize=Math.max(22,tSize*.95);sSize=Math.max(13,sSize*.96);
  titleEl.style.fontSize=tSize+'px';subEl.style.fontSize=sSize+'px';
}
if(!subEl.textContent.trim()){subEl.style.display='none';document.querySelector('.rule').style.display='none';}
const tl=gsap.timeline({paused:true});
gsap.set('.lt-card',{opacity:0,x:-36,scaleX:.96,transformOrigin:'0% 50%'});
gsap.set('.accent-bar',{scaleY:0});
gsap.set('.lt-kicker',{opacity:0,x:-14});
gsap.set('.lt-kicker-line',{scaleX:0});
gsap.set('.title',{y:'110%',opacity:0});
gsap.set('.rule',{scaleX:0});
gsap.set('.subtitle',{y:'110%',opacity:0});
gsap.set('.hud-top',{opacity:0,y:-8});
tl.addLabel('enter',0)
  .to('.hud-top',{opacity:1,y:0,duration:.6,ease:'power2.out'},.05)
  .to('.lt-card',{opacity:1,x:0,scaleX:1,duration:.75,ease:'power3.out'},.12)
  .to('.accent-bar',{scaleY:1,duration:.65,ease:'expo.out'},.2)
  .to('.lt-kicker',{opacity:1,x:0,duration:.45,ease:'power2.out'},.42)
  .to('.lt-kicker-line',{scaleX:1,duration:.5,ease:'power2.out'},.45)
  .to('.title',{y:'0%',opacity:1,duration:.72,ease:'power3.out'},.48)
  .to('.rule',{scaleX:1,duration:.65,ease:'power2.inOut'},.72)
  .to('.subtitle',{y:'0%',opacity:1,duration:.65,ease:'power3.out'},.82)
  .addLabel('hold',1.6)
  .to('.shimmer',{left:'115%',duration:1.25,ease:'power1.inOut'},2.25)
  .to('.live-dot',{opacity:.35,duration:.65,yoyo:true,repeat:7,ease:'sine.inOut'},1.0)
  .addLabel('exit',6.7)
  .to('.subtitle',{y:'100%',opacity:0,duration:.42,ease:'power2.in'},6.72)
  .to('.rule',{scaleX:0,transformOrigin:'right',duration:.35,ease:'power2.in'},6.82)
  .to('.title',{y:'100%',opacity:0,duration:.45,ease:'power2.in'},6.86)
  .to('.lt-kicker',{opacity:0,x:-10,duration:.35,ease:'power2.in'},6.92)
  .to('.accent-bar',{scaleY:0,transformOrigin:'50% 0%',duration:.45,ease:'power3.in'},7.02)
  .to('.lt-card',{opacity:0,x:-28,duration:.5,ease:'power3.in'},7.12)
  .to('.progress-fill',{scaleX:1,duration:DURATION,ease:'none'},0)
  .addLabel('complete',DURATION);
window.__timelines=window.__timelines||{};window.__timelines[stage.dataset.compositionId]=tl;
let clock=0,playing=false,raf=0,last=0,speedIdx=1,capturing=document.documentElement.classList.contains('render');
const SPEEDS=[0.5,1,2];
const play=document.querySelector('#play'),speedBtn=document.querySelector('#speed'),seek=document.querySelector('#seek'),time=document.querySelector('#time');
function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=0;play.textContent='Play';}
function draw(s){if(!Number.isFinite(s))throw new TypeError('Time must be finite');clock=Math.max(0,Math.min(DURATION,s));tl.seek(clock,true);seek.value=String(clock);time.textContent=clock.toFixed(2)+' / 8.00s';return clock;}
function frame(now){if(!playing)return;if(last)draw(clock+((now-last)/1000)*SPEEDS[speedIdx]);last=now;if(clock>=DURATION){pause();return;}raf=requestAnimationFrame(frame);}
function start(){if(playing){pause();return;}if(capturing)return;if(clock>=DURATION)draw(0);playing=true;last=0;play.textContent='Pause';raf=requestAnimationFrame(frame);}
play.addEventListener('click',start);document.querySelector('#reset').addEventListener('click',()=>{pause();draw(0);});
speedBtn.addEventListener('click',()=>{speedIdx=(speedIdx+1)%SPEEDS.length;speedBtn.textContent=SPEEDS[speedIdx]+'×';});
seek.addEventListener('input',()=>{pause();draw(Number(seek.value));});
addEventListener('keydown',e=>{if(capturing||e.metaKey||e.ctrlKey||e.altKey)return;if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();start();}else if(e.key==='r'||e.key==='R'){pause();draw(0);}});
window.__motion={seek(s){pause();return draw(s);},reset(){pause();return draw(0);},duration:DURATION,getTime:()=>clock};
window.__advance=ms=>{if(!Number.isFinite(ms)||ms<0)throw new TypeError('Advance must be finite and nonnegative');capturing=true;pause();return draw(clock+ms/1000);};
window.__done=()=>clock>=DURATION;
draw(0);window.__ready=true;
if(!capturing&&matchMedia('(prefers-reduced-motion: reduce)').matches)draw(4.0);
else if(!capturing)start();
})();
</script>
</body>
</html>
