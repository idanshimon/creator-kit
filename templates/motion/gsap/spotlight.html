<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@ — feature spotlight</title>
<script>document.documentElement.classList.toggle('render',new URLSearchParams(location.search).has('render'));</script>
<style>
:root{color-scheme:dark;--bg:#06070d;--ink:#f8fafc;--muted:#a5b4cf;--a:#6366f1;--b:#22d3ee;--c:#a855f7;--title-size:@@TITLE_SIZE@@px}
*{box-sizing:border-box;margin:0}
html,body{height:100vh;background:#04050a;color:var(--ink);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body{display:grid;grid-template-rows:1fr auto}
.viewport{position:relative;min-height:0;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;overflow:hidden;
 background:radial-gradient(920px 540px at 50% 48%,rgba(99,102,241,.18),transparent 62%),radial-gradient(640px 420px at 78% 24%,rgba(34,211,238,.12),transparent 58%),#06070d}
.aura{position:absolute;width:620px;height:620px;border-radius:50%;filter:blur(110px);opacity:0;pointer-events:none}
.a1{background:var(--a);left:120px;top:-180px}.a2{background:var(--b);right:80px;bottom:-220px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 50%,black 25%,transparent 76%)}
.card-wrap{position:absolute;left:100px;top:96px;width:1080px;height:528px}
.card{position:relative;width:100%;height:100%;border-radius:28px;background:linear-gradient(160deg,rgba(18,22,38,.9),rgba(9,11,20,.94));border:1px solid rgba(255,255,255,.08);box-shadow:0 32px 90px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 72px;text-align:center}
svg.border-fx{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);pointer-events:none;overflow:visible}
.glow-rect{fill:none;stroke:url(#spotGrad);stroke-width:2.6;filter:drop-shadow(0 0 14px rgba(34,211,238,.55))}
.sweep{position:absolute;top:-20%;bottom:-20%;width:260px;left:-340px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent);transform:skewX(-20deg);pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;background:rgba(99,102,241,.16);border:1px solid rgba(129,140,248,.4);color:#c7d2fe;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;margin-bottom:28px}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--b);box-shadow:0 0 10px var(--b)}
.title{font-size:var(--title-size);font-weight:800;line-height:1.05;letter-spacing:-.035em;max-width:936px;overflow-wrap:anywhere;background:linear-gradient(180deg,#ffffff 25%,#cbd5e1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:34px;max-width:920px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:11px 22px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.15);color:#e2e8f0;font-size:20px;font-weight:600;letter-spacing:-.01em;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pill-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.pill:nth-child(3n+1) .pill-dot{background:var(--b);box-shadow:0 0 10px var(--b)}
.pill:nth-child(3n+2) .pill-dot{background:var(--a);box-shadow:0 0 10px var(--a)}
.pill:nth-child(3n) .pill-dot{background:var(--c);box-shadow:0 0 10px var(--c)}
.footer-tag{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:rgba(165,180,207,.58)}
.progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--a),var(--b),var(--c));transform-origin:left;transform:scaleX(0)}
.controls{display:flex;align-items:center;gap:12px;padding:12px 24px;border-top:1px solid #ffffff1a;background:#06070d}
.controls button{border:1px solid #ffffff2e;border-radius:7px;background:#14182b;color:#f1f5f9;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.controls input{flex:1;min-width:44px;accent-color:var(--b)}
.time{font:12px monospace;min-width:86px;color:var(--muted);white-space:nowrap}
.render .controls{display:none}
@media(max-width:550px){.controls{gap:6px;padding:8px}.controls button{padding:6px 8px;font-size:12px}.time{font-size:10px;min-width:68px}}
</style>
</head>
<body>
<div class="viewport">
<main class="stage" data-composition-id="gsap-spotlight" data-duration="8" aria-label="GSAP spotlight reveal composition">
  <div class="aura a1"></div><div class="aura a2"></div>
  <div class="grid"></div>
  <section class="card-wrap" aria-label="Feature spotlight card">
    <div class="card">
      <div class="sweep"></div>
      <div class="badge"><span class="badge-dot"></span><span>FEATURE SPOTLIGHT</span></div>
      <h1 class="title">@@TITLE@@</h1>
      <div class="pills" data-text="@@SUBTITLE@@"></div>
    </div>
    <svg class="border-fx" viewBox="0 0 1084 532" aria-hidden="true">
      <defs>
        <linearGradient id="spotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#22d3ee"/>
          <stop offset="50%" stop-color="#6366f1"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
      </defs>
      <rect class="glow-rect" x="2" y="2" width="1080" height="528" rx="28" ry="28"/>
    </svg>
  </section>
  <div class="footer-tag">CREATOR KIT · OFFLINE · FRAME-EXACT</div>
  <div class="progress"><div class="progress-fill"></div></div>
</main>
</div>
<nav class="controls" aria-label="Motion preview controls"><button id="play" type="button">Play</button><button id="reset" type="button">Reset</button><button id="speed" type="button" aria-label="Playback speed">1×</button><input id="seek" aria-label="Seek animation" type="range" min="0" max="8" step="0.01" value="0"><output class="time" id="time">0.00 / 8.00s</output></nav>
<!-- GSAP's original proprietary notice is retained in the runtime below. Standard License: https://gsap.com/standard-license/ -->
<script>@@RUNTIME@@</script>
<script>
(()=>{'use strict';
const DURATION=8,stage=document.querySelector('.stage'),viewport=document.querySelector('.viewport');
const fit=()=>stage.style.setProperty('--fit',Math.min(viewport.clientWidth/1280,viewport.clientHeight/720));
fit();addEventListener('resize',fit);
// Populate feature pills safely from escaped data-text attribute.
const pillsEl=document.querySelector('.pills');
const parts=pillsEl.dataset.text.split(/\s*[·|•]\s*/).map(s=>s.trim()).filter(Boolean).slice(0,8);
for(const part of parts){
  const p=document.createElement('span');p.className='pill';
  const d=document.createElement('span');d.className='pill-dot';
  p.appendChild(d);p.appendChild(document.createTextNode(part));
  pillsEl.appendChild(p);
}
if(!parts.length)pillsEl.style.display='none';
// Fit title and pills inside the 528px card before timeline construction.
const card=document.querySelector('.card'),titleEl=document.querySelector('.title');
let tSize=parseFloat(getComputedStyle(titleEl).fontSize),pSize=20;
for(let i=0;card.scrollHeight>card.clientHeight&&i<40;i++){
  tSize=Math.max(28,tSize*.94);pSize=Math.max(13,pSize*.96);
  titleEl.style.fontSize=tSize+'px';
  for(const pill of pillsEl.children)pill.style.fontSize=pSize+'px';
}
const rect=document.querySelector('.glow-rect'),perim=rect.getTotalLength();
gsap.set(rect,{strokeDasharray:perim,strokeDashoffset:perim});
gsap.set('.card',{opacity:0,scale:.95,y:16});
gsap.set('.badge',{opacity:0,y:-12});
gsap.set('.title',{opacity:0,y:26,scale:.97});
gsap.set('.pill',{opacity:0,y:22,scale:.9});
gsap.set('.footer-tag',{opacity:0});
const tl=gsap.timeline({paused:true});
tl.addLabel('reveal',0)
  .to('.aura',{opacity:.34,duration:1.4,stagger:.2,ease:'power2.out'},0)
  .to('.card',{opacity:1,scale:1,y:0,duration:.8,ease:'power3.out'},.08)
  .to(rect,{strokeDashoffset:0,duration:1.55,ease:'power2.inOut'},.18)
  .to('.badge',{opacity:1,y:0,duration:.55,ease:'power2.out'},.35)
  .to('.title',{opacity:1,y:0,scale:1,duration:.85,ease:'power3.out'},.48)
  .addLabel('features',1.05)
  .to('.pill',{opacity:1,y:0,scale:1,duration:.6,stagger:.16,ease:'back.out(1.7)'},1.05)
  .to('.footer-tag',{opacity:1,duration:.7,ease:'power2.out'},1.75)
  .addLabel('sweep',2.1)
  .to('.sweep',{left:'118%',duration:1.35,ease:'power2.inOut'},2.15)
  .set('.sweep',{left:'-340px'},4.8)
  .to('.sweep',{left:'118%',duration:1.45,ease:'power2.inOut'},5.1)
  .to('.progress-fill',{scaleX:1,duration:DURATION,ease:'none'},0)
  .addLabel('complete',DURATION);
window.__timelines=window.__timelines||{};window.__timelines[stage.dataset.compositionId]=tl;
let clock=0,playing=false,raf=0,last=0,speedIdx=1,capturing=document.documentElement.classList.contains('render');
const SPEEDS=[0.5,1,2];
const play=document.querySelector('#play'),speedBtn=document.querySelector('#speed'),seek=document.querySelector('#seek'),time=document.querySelector('#time');
function pause(){playing=false;if(raf)cancelAnimationFrame(raf);raf=0;play.textContent='Play';}
function draw(s){if(!Number.isFinite(s))throw new TypeError('Time must be finite');clock=Math.max(0,Math.min(DURATION,s));tl.seek(clock,true);seek.value=String(clock);time.textContent=clock.toFixed(2)+' / 8.00s';return clock;}
function frame(now){if(!playing)return;if(last)draw(clock+((now-last)/1000)*SPEEDS[speedIdx]);last=now;if(clock>=DURATION){pause();return;}raf=requestAnimationFrame(frame);}
function start(){if(playing){pause();return;}if(capturing)return;if(clock>=DURATION)draw(0);playing=true;last=0;play.textContent='Pause';raf=requestAnimationFrame(frame);}
play.addEventListener('click',start);document.querySelector('#reset').addEventListener('click',()=>{pause();draw(0);});
speedBtn.addEventListener('click',()=>{speedIdx=(speedIdx+1)%SPEEDS.length;speedBtn.textContent=SPEEDS[speedIdx]+'×';});
seek.addEventListener('input',()=>{pause();draw(Number(seek.value));});
addEventListener('keydown',e=>{if(capturing||e.metaKey||e.ctrlKey||e.altKey)return;if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();start();}else if(e.key==='r'||e.key==='R'){pause();draw(0);}});
window.__motion={seek(s){pause();return draw(s);},reset(){pause();return draw(0);},duration:DURATION,getTime:()=>clock};
window.__advance=ms=>{if(!Number.isFinite(ms)||ms<0)throw new TypeError('Advance must be finite and nonnegative');capturing=true;pause();return draw(clock+ms/1000);};
window.__done=()=>clock>=DURATION;
draw(0);window.__ready=true;
if(!capturing&&matchMedia('(prefers-reduced-motion: reduce)').matches)draw(DURATION);
else if(!capturing)start();
})();
</script>
</body>
</html>
